<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sisiyyiyi | Official Link Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-velvet-ruby">
    <!-- 动态背景图与微模糊压暗遮罩层 -->
    <div id="site-bg" class="site-bg-image" style="background-image: url('images/bg.jpg');"></div>
    <div class="site-bg-overlay"></div>

    <!-- 右上角“更多功能/举报”浮动按钮 -->
    <button id="open-features-btn" class="more-features-btn" title="更多功能/举报">
        <i class="fa-solid fa-compass"></i> 更多功能/举报
    </button>
    
    <div class="container">
        <!-- Profile Header -->
        <div class="profile-section">
            <div class="avatar-wrapper">
                <img id="profile-avatar" src="images/avatar.jpg" alt="Avatar">
                <div class="avatar-ring"></div>
            </div>
            <h1 id="profile-name">sisiyyiyi</h1>
            <!-- 个人简介文字已完全交由后台动态控制渲染 -->
            <p id="profile-bio"></p>
        </div>

        <!-- Links & Buttons Container -->
        <div id="links-container" class="links-container">
            <!-- Dynamically rendered links -->
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 sisiyyiyi. All Rights Reserved.</p>
            <a href="admin.html" class="hidden-admin-link" title="Admin Login"><i class="fa-solid fa-lock"></i></a>
        </footer>
    </div>

    <!-- 更多功能覆盖页面（默认隐藏） -->
    <div id="more-features-modal" class="feature-overlay" style="display: none;">
        <div class="feature-overlay-header">
            <button id="close-features-btn" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> 返回主页</button>
            <h2>更多功能与服务</h2>
        </div>
        <div class="feature-overlay-body">
            <!-- 二维码区块 -->
            <div class="feature-card">
                <h3><i class="fa-solid fa-qrcode"></i> 主页专属二维码</h3>
                <p>长按或点击下方按钮保存主页二维码，方便分享推广</p>
                <div class="qr-box">
                    <img id="feature-qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fsisiyyiyi1.pages.dev%2F" alt="QR Code">
                </div>
                <button id="download-qr-btn" class="btn-primary" style="margin-top: 15px;"><i class="fa-solid fa-download"></i> 保存二维码到设备</button>
            </div>

            <!-- 投诉举报区块 -->
            <div class="feature-card">
                <h3><i class="fa-solid fa-triangle-exclamation"></i> 不良行为投诉与举报</h3>
                <p>如发现侵权、冒充或不良行为，请随时向我反馈</p>
                <button id="toggle-report-btn" class="btn-secondary" style="width: 100%; margin-top: 10px;"><i class="fa-solid fa-triangle-exclamation"></i> 投诉/举报</button>
                
                <!-- 举报表单（默认隐藏，点击后延展出现） -->
                <form id="report-form" class="report-form-box" style="display: none;">
                    <div class="form-group">
                        <label>举报理由 <span class="required-star">*</span></label>
                        <textarea id="report-reason" rows="3" placeholder="请详细描述举报原因..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>手机 <span class="required-star">*</span></label>
                        <input type="text" id="report-phone" placeholder="请输入您的手机号码">
                    </div>
                    <div class="form-group">
                        <label>QQ <span class="required-star">*</span></label>
                        <input type="text" id="report-qq" placeholder="请输入您的QQ号">
                    </div>
                    <button type="submit" class="btn-primary">提交举报</button>
                    <p id="report-tips" class="report-tips-text"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Video Modal -->
    <div id="video-modal" class="modal">
        <div class="modal-content video-modal-content">
            <button class="close-modal" id="close-video">&times;</button>
            <div class="video-container" id="video-player-wrapper"></div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="image-modal" class="modal">
        <div class="modal-content image-modal-content">
            <button class="close-modal" id="close-image">&times;</button>
            <img id="showcase-img" src="" alt="Showcase">
        </div>
    </div>

    <!-- Password Modal -->
    <div id="password-modal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <button class="close-modal" id="close-password">&times;</button>
            <h3><i class="fa-solid fa-shield-keyhole" style="color:var(--accent-color);"></i> 私密内容保护</h3>
            <p style="color:var(--text-secondary); margin: 10px 0 20px 0; font-size: 0.9rem;">此按钮已被上锁，请输入访问密码：</p>
            <form id="password-form">
                <div class="form-group">
                    <input type="password" id="access-password-input" required placeholder="请输入访问密码">
                </div>
                <button type="submit" class="btn-primary">确认解锁</button>
                <p id="password-error" class="error-msg"></p>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
