<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Lana Vice</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-velvet-ruby admin-body">
    <!-- Login Screen -->
    <div id="login-screen" class="login-overlay">
        <div class="login-card">
            <h2><i class="fa-solid fa-shield-halved"></i> 后台登录</h2>
            <p>请输入管理员账号与密码</p>
            <form id="login-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-user" required placeholder="管理员用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-pass" required placeholder="管理员密码">
                </div>
                <button type="submit" class="btn-primary">安全登录</button>
                <p id="login-error" class="error-msg"></p>
            </form>
            <div class="back-home">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> 返回主页</a>
            </div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="dashboard-container" style="display: none;">
        <header class="dash-header">
            <h1><i class="fa-solid fa-sliders"></i> 个人主页管理后台</h1>
            <div class="dash-actions">
                <a href="index.html" target="_blank" class="btn-secondary"><i class="fa-solid fa-eye"></i> 预览主页</a>
                <button id="logout-btn" class="btn-danger"><i class="fa-solid fa-right-from-bracket"></i> 登出</button>
            </div>
        </header>

        <div class="dash-grid">
            <!-- Profile Settings Card -->
            <div class="dash-card">
                <h2><i class="fa-solid fa-user-pen"></i> 个人资料与安全设置</h2>
                <form id="profile-form">
                    <div class="form-group">
                        <label>昵称 (Name)</label>
                        <input type="text" id="cfg-name" required>
                    </div>
                    <div class="form-group">
                        <label>个人简介 (Bio)</label>
                        <textarea id="cfg-bio" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>头像图片路径 (Avatar URL)</label>
                        <input type="text" id="cfg-avatar" required>
                    </div>
                    <div class="form-group">
                        <label>背景图片路径 (Background Image URL)</label>
                        <input type="text" id="cfg-bg" required placeholder="images/bg.jpg">
                    </div>
                    <div class="form-group">
                        <label>私密链接/按钮共享访问密码 (Link Password)</label>
                        <input type="text" id="cfg-password" required placeholder="访客访问受保护按钮时输入的密码">
                    </div>
                    <div class="form-group">
                        <label>整体色调预设 (Color Palette)</label>
                        <select id="cfg-theme">
                            <option value="velvet-ruby">Velvet Ruby (丝绒酒红 - 诱惑暗黑)</option>
                            <option value="midnight-orchid">Midnight Orchid (午夜兰花 - 魅惑紫红)</option>
                            <option value="obsidian-gold">Obsidian Gold (黑金奢华 - 经典高贵)</option>
                            <option value="siren-crimson">Siren Crimson (海妖绯红 - 极致诱惑)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>自定义字体名称</label>
                        <input type="text" id="cfg-font" placeholder="例如: CustomFont 或留空默认">
                    </div>
                    <button type="submit" class="btn-primary">保存基本设置</button>
                </form>
            </div>

            <!-- Links & Buttons Manager Card (Mobile Card List) -->
            <div class="dash-card">
                <div class="card-header-flex">
                    <h2><i class="fa-solid fa-link"></i> 跳转按钮与多媒体管理</h2>
                    <button id="add-btn-trigger" class="btn-primary"><i class="fa-solid fa-plus"></i> 添加新按钮</button>
                </div>
                <!-- 竖屏适配的卡片列表容器 -->
                <div id="admin-links-container" class="admin-links-list">
                    <!-- 动态生成的卡片插入到这里 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Edit/Add Modal -->
    <div id="btn-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title-text">添加新按钮</h3>
            <form id="btn-form">
                <input type="hidden" id="edit-btn-id">
                <div class="form-group">
                    <label>按钮文本标题</label>
                    <input type="text" id="btn-title-input" required placeholder="例如: 🎬 观看最新视频">
                </div>
                <div class="form-group">
                    <label>按钮类型 (Type)</label>
                    <select id="btn-type-input">
                        <option value="link">普通网页跳转 (Link)</option>
                        <option value="video">视频播放器按钮 (Video Modal)</option>
                        <option value="image">图片展示按钮 (Image Showcase)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>目标链接 / 视频源 / 图片路径 (URL)</label>
                    <input type="text" id="btn-url-input" required placeholder="https://... 或 videos/xxx.mp4">
                </div>
                <div class="form-group">
                    <label>图标 Class (FontAwesome)</label>
                    <input type="text" id="btn-icon-input" required placeholder="fa-solid fa-fire">
                </div>
                <div class="form-group">
                    <label>按钮色调 (Color Tone)</label>
                    <select id="btn-color-input">
                        <option value="ruby">Ruby Red (红宝石)</option>
                        <option value="magenta">Neon Magenta (霓虹品红)</option>
                        <option value="gold">Rose Gold (玫瑰金)</option>
                        <option value="purple">Velvet Purple (丝绒紫)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>安全锁定保护 (Password Protection)</label>
                    <select id="btn-locked-input">
                        <option value="false">公开访问 (Unlocked)</option>
                        <option value="true">密码上锁保护 (Locked)</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" id="cancel-btn-modal" class="btn-secondary">取消</button>
                    <button type="submit" class="btn-primary">保存按钮</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
